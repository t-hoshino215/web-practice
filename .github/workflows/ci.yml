name: CI

# PR毎、およびmainへのpush毎に実行する
on:
  pull_request:
  push:
    branches:
      - main

# 同じブランチで新しいpushがあったら、実行中の古いCIをキャンセルする（実行時間の節約）
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# ワークフロー全体の既定権限を「読み取りのみ」に絞る
permissions:
  contents: read

jobs:
# ----- Backend -----
  backend:
    name: Backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # このジョブのすべての run: を backend/ で実行する
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up uv
        uses: astral-sh/setup-uv@v10.0.1
        with:
          version: "0.12.5"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format)
        run: uv run ruff format --check .

      - name: Type check (mypy)
        run: uv run mypy src

      - name: Test (pytest)
        run: uv run pytest --cov

# ----- Frontend -----
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      # package.json の packageManager フィールドを読んで pnpm を用意する、リポジトリルート以外に package.json があるためパスを指定
      - name: Set up pnpm
        uses: pnpm/action-setup@v6.0.10
        with:
          package_json_file: frontend/package.json

      # cache: pnpm はpnpmが先に入っていることが前提
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # package.json のスクリプトを使って各種チェックを実行 (※pnpm test はウォッチモードだと止まらないため1回実行であること)
      - name: Lint (ESLint)
        run: pnpm lint

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Type check (tsc)
        run: pnpm typecheck

      - name: Test (Vitest)
        run: pnpm test

# ----- Dockerfile -----
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # テストが通ってから実行する（無駄なビルドを避ける）
    needs:
      - backend
      - frontend
    strategy:
      # 同じ手順を、変数を変えて並列に実行する
      matrix:
        include:
          - name: backend
            context: ./backend
          - name: frontend
            context: ./frontend
    steps:
      - name: Check out the repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image (${{ matrix.name }})
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: runtime
          push: false
          load: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
